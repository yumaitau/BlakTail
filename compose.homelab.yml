# Homelab overlay: HTTPS on the LAN so Better Auth production cookies work.
# 127.0.0.1 is also trusted so Lightpanda can drive the UI through an SSH tunnel.
# Tailscale may already listen on 8443. Default publish is loopback so compose
# still starts. For LAN agents set BLAKTAIL_COORD_PUBLISH=192.168.1.19:8443
# (host:port, no scheme).
services:
  coord:
    ports: !override
      - "${BLAKTAIL_COORD_PUBLISH:-127.0.0.1:8443}:8443"
      - "127.0.0.1:9701:9701"

  console:
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_URL},https://127.0.0.1:3443
  console-migrate:
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_URL},https://127.0.0.1:3443
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - coordcerts:/certs:ro
      - ${BLAKTAIL_CADDYFILE:-./deploy/homelab/Caddyfile}:/etc/caddy/Caddyfile:ro
    depends_on:
      console:
        condition: service_started

  agent-office:
    image: blaktail-agent
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    profiles: ["acl-prove"]
    hostname: office-box
    privileged: true
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/net/tun
    volumes:
      - coordcerts:/certs:ro
      - agent-office-data:/var/lib/blaktail
    environment:
      BLAKTAIL_COORD_CA: /certs/ca.crt
    depends_on:
      coord:
        condition: service_started

  agent-store:
    image: blaktail-agent
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    profiles: ["acl-prove"]
    hostname: store-box
    privileged: true
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/net/tun
    volumes:
      - coordcerts:/certs:ro
      - agent-store-data:/var/lib/blaktail
    environment:
      BLAKTAIL_COORD_CA: /certs/ca.crt
    depends_on:
      coord:
        condition: service_started

  vanilla-wg:
    image: debian:bookworm-slim
    profiles: ["acl-prove"]
    hostname: vanilla-wg
    privileged: true
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/net/tun
    command: ["sleep", "infinity"]
    depends_on:
      coord:
        condition: service_started

  dns-sink:
    image: debian:bookworm-slim
    profiles: ["acl-prove"]
    hostname: dns-sink
    cap_add:
      - NET_BIND_SERVICE
    command: ["sleep", "infinity"]
    depends_on:
      coord:
        condition: service_started

volumes:
  agent-office-data:
  agent-store-data:
