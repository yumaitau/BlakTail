# Runtime secrets live in AWS Secrets Manager (Sydney) and are synced by the
# cluster's External Secrets Operator. Nothing secret is stored in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blaktail-runtime
  namespace: blaktail
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blaktail-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: blaktail-eks-runtime
---
# Database administrator credentials, used only by the db-init Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blaktail-db-admin
  namespace: blaktail
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blaktail-db-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: blaktail-eks-db-admin
