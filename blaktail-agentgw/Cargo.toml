[package]
name = "blaktail-agentgw"
description = "BlakTail agent network: an organisation-run, overlay-only AI model gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
base64 = "0.22"
blaktail-coord = { path = "../blaktail-coord" }
hmac = "0.12"
sha2 = "0.10"
