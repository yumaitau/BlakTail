[package]
name = "blaktaild"
description = "BlakTail WireGuard node agent (Linux and macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
blaktail-config = { path = "../blaktail-config" }
blaktail-relay = { path = "../blaktail-relay" }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
hkdf = "0.13"
hmac = "0.13"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
boringtun = { version = "0.7.1", features = ["device"] }
libc = "0.2"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
blaktail-ios-wg = { path = "../blaktail-ios-wg" }
wintun = "0.4"


[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
tempfile = "3"
