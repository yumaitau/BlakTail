[package]
name = "blaktaild"
description = "BlakTail WireGuard node agent (Linux and macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
blaktail-config = { path = "../blaktail-config" }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
boringtun = { version = "0.7.1", features = ["device"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
blaktail-ios-wg = { path = "../blaktail-ios-wg" }
wintun = "0.4"

[dev-dependencies]
blaktail-relay = { path = "../blaktail-relay" }
