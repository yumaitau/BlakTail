openapi: 3.1.0
info:
  title: BlakTail Admin API
  version: "1"
  description: |
    Organisation-scoped automation API. Distinct from node protocol routes
    and console HMAC assertions. Compatibility is additive inside `/api/v1`.
    Request bodies are limited to 64 KiB. Each `bta_` client is limited to
    120 requests per 60-second window.
servers:
  - url: https://coord.example
security:
  - bearerAuth: []
  - organisationHeader: []
paths:
  /api/v1/status:
    get:
      summary: Service readiness
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200":
          description: Ready
        "401":
          description: Authentication failed
        "403":
          description: Missing status:read
  /api/v1/devices:
    get:
      summary: List devices
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string, enum: [active, online, offline, revoked, deleted, expired, ephemeral] }
        - in: query
          name: include_deleted
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: before
          schema: { type: string }
      responses:
        "200":
          description: Envelope of devices
  /api/v1/devices/{node_id}:
    get:
      summary: Get one device
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200": { description: Device }
        "404": { description: Not found }
    delete:
      summary: Revoke a device
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204": { description: Revoked }
        "403": { description: Missing devices:write }
  /api/v1/devices/{node_id}/friendly-name:
    put:
      summary: Set or clear a friendly name
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendly_name]
              properties:
                friendly_name: { type: string, maxLength: 64 }
      responses:
        "204": { description: Updated }
  /api/v1/devices/{node_id}/tombstone:
    post:
      summary: Delete a device from default inventory
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204": { description: Tombstoned }
  /api/v1/devices/{node_id}/routes:
    put:
      summary: Approve advertised routes
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204": { description: Updated }
  /api/v1/keys:
    get:
      summary: List join-key metadata (never the secret or its hash)
      description: Browser-approval grants are excluded. Requires keys:read or keys:write.
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: "Envelope of keys with name, use counts, expiry and state" }
        "403": { description: Missing keys:read }
    post:
      summary: Mint an enrolment key
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201": { description: Key shown once }
        "409": { description: Idempotency key reused with a different body }
        "413": { description: Request body larger than 64 KiB }
        "429": { description: Client exceeded 120 requests per minute }
  /api/v1/policy:
    get:
      summary: Read ACL plus etag, revision, and generated legacy default
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: Policy }
    put:
      summary: Replace or roll back ACL; etag is required
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "204": { description: Updated }
        "400": { description: Missing etag or no previous revision }
        "412": { description: etag mismatch }
        "413": { description: Request body larger than 64 KiB }
        "429": { description: Client exceeded 120 requests per minute }
  /api/v1/dns:
    get:
      summary: Read organisation DNS settings plus etag
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: DNS snapshot }
    put:
      summary: Publish or roll back organisation DNS settings
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: Published snapshot }
        "412": { description: etag mismatch }
        "413": { description: Body exceeded 64 KiB }
        "429": { description: Rate limit exceeded }
  /api/v1/wireguard-only-peers:
    get:
      summary: List WireGuard-only peers
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200":
          description: Envelope of peers. Private keys are never stored or returned.
    post:
      summary: Create a WireGuard-only peer from an external public key
      parameters:
        - $ref: "#/components/parameters/Organisation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, wg_public_key, endpoint, allowed_ips]
              properties:
                name: { type: string, maxLength: 64 }
                kind: { type: string, enum: [wireguard_only] }
                wg_public_key: { type: string }
                endpoint: { type: string }
                allowed_ips:
                  type: array
                  items: { type: string }
                tags:
                  type: array
                  items: { type: string }
                expires_at: { type: integer }
      responses:
        "201": { description: Created public-key export }
        "403": { description: Missing devices:write }
        "409": { description: Name or public key already exists }
        "413": { description: Request body larger than 64 KiB }
        "429": { description: Client exceeded 120 requests per minute }
  /api/v1/wireguard-only-peers/{peer_id}:
    get:
      summary: Get one WireGuard-only peer
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/PeerId"
      responses:
        "200": { description: Peer }
        "404": { description: Not found }
    delete:
      summary: Revoke a WireGuard-only peer
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/PeerId"
      responses:
        "204": { description: Revoked }
  /api/v1/wireguard-only-peers/{peer_id}/rotate:
    post:
      summary: Rotate a WireGuard-only public key with a bounded overlap window
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/PeerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wg_public_key]
              properties:
                wg_public_key: { type: string }
                overlap_seconds: { type: integer, minimum: 15, maximum: 86400 }
      responses:
        "200": { description: Current key plus previous key until overlap_until }
        "400": { description: Same key or invalid overlap window }
        "403": { description: Missing devices:write }
        "409": { description: Public key already exists }
        "403": { description: Missing devices:write }
        "409": { description: Already revoked }
  /api/v1/webhooks:
    get:
      summary: List organisation webhook destinations
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: Envelope of destinations without secrets }
    post:
      summary: Create a signed HTTPS webhook destination
      description: |
        Optional `event_types` (catalogued types or "*", the default) limits
        what the destination receives. Rejected targets: non-HTTPS, embedded
        credentials, loopback, private, link-local, CGNAT/overlay (100.64/10),
        multicast, reserved, IPv4-mapped forms of those, `.internal`/`.local`
        names and cloud metadata addresses. Delivery re-resolves the host,
        re-checks every address and connects only to a checked address.
      parameters:
        - $ref: "#/components/parameters/Organisation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64 }
                url: { type: string, format: uri }
                event_types: { type: array, items: { type: string } }
      responses:
        "201": { description: Destination plus shown-once signing secret }
        "400": { description: SSRF, invalid URL or unknown event type }
  /api/v1/webhooks/{destination_id}:
    delete:
      summary: Disable a webhook destination
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - name: destination_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Disabled }
  /api/v1/webhooks/{destination_id}/deliveries:
    get:
      summary: List recent deliveries for one destination
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - name: destination_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Envelope of delivery attempts }
  /api/v1/webhooks/deliveries/{delivery_id}/replay:
    post:
      summary: Replay a failed or dead-lettered delivery
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - name: delivery_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Requeued }
  /api/v1/audit:
    get:
      summary: List audit events, newest first, with keyset pagination and filters
      description: |
        Pass `next_cursor` back as `before` for the next page. Detail keys
        that name secrets (token, secret, password, signature and similar)
        and values shaped like BlakTail credentials, JWTs or PEM blocks are
        returned as `[redacted]`. Requires `audit:read`.
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: before
          schema: { type: string, description: "created_at:id cursor" }
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetId"
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
      responses:
        "200": { description: Envelope of events with next_cursor }
        "400": { description: Invalid cursor or filter }
        "403": { description: Missing audit:read }
  /api/v1/network-resources:
    get:
      summary: List network resources with routing-peer health and effective distribution
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: Envelope of network resources }
        "403": { description: Missing devices:read }
    post:
      summary: Create a named network resource (approval of its prefix for selected clients)
      description: |
        Exactly one of `cidr` (IPv4 or IPv6) or `dns_target` is required.
        Default and public prefixes need `confirm_public_route: true` from an
        organisation owner; automation clients act as admins and cannot
        confirm them. `dry_run: true` validates and returns the evaluated
        resource without saving. Honours `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkResourceInput" }
      responses:
        "200": { description: Dry run result (not saved) }
        "201": { description: Created resource }
        "400": { description: Invalid target, ports, access or routing peers; public route without confirmation }
        "403": { description: Missing routes:write, or public route confirmed by a non-owner }
        "409": { description: Overlaps the overlay pool, another resource or a device-approved route; name exists; Idempotency-Key reused }
  /api/v1/network-resources/{resource_id}:
    get:
      summary: Get one network resource
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200": { description: Resource with status }
        "404": { description: Not found in this organisation }
    put:
      summary: Replace a network resource (edit, enable or disable)
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NetworkResourceInput"
                - type: object
                  required: [etag]
                  properties:
                    etag: { type: string }
      responses:
        "200": { description: Updated resource }
        "400": { description: Missing etag or invalid resource }
        "403": { description: Missing routes:write }
        "404": { description: Not found }
        "409": { description: Overlap or name conflict }
        "412": { description: Stale etag }
    delete:
      summary: Delete a network resource and withdraw its routes
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/ResourceId"
        - in: header
          name: If-Match
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "403": { description: Missing routes:write }
        "404": { description: Not found }
        "412": { description: Stale If-Match etag }
  /api/v1/audit/export:
    get:
      summary: Export matching audit events as JSON or CSV (at most 10000 rows)
      description: |
        Requires `audit:export` (people: the export_audit permission —
        owner, admin, auditor). The export itself is recorded as an
        `audit.exported` audit event with its format, filters and row count.
        `X-BlakTail-Export-Truncated: true` means the cap was reached; narrow
        the date range. CSV cells beginning with = + - @ are prefixed with '.
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: query
          name: format
          schema: { type: string, enum: [json, csv], default: json }
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetId"
        - $ref: "#/components/parameters/AuditSince"
        - $ref: "#/components/parameters/AuditUntil"
      responses:
        "200": { description: "JSON {data, truncated} or text/csv attachment" }
        "400": { description: Unknown format or invalid filter }
        "403": { description: Missing audit:export }
  /api/v1/audit/verify:
    get:
      summary: Verify the organisation's audit hash chain inside the retention window
      description: |
        Each coordinator audit row written since schema 27 records its
        sequence, the previous row's hash and its own hash. The report lists
        edited rows, gaps and a missing tail. Rows written before the chain
        existed are counted as `unchained_events`. Requires `audit:read`.
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: "Envelope of {intact, chained_events, unchained_events, first_seq, last_seq, head_seq, problems, note}" }
        "403": { description: Missing audit:read }
  /api/v1/traffic/events:
    get:
      summary: List opt-in per-flow traffic events, newest first
      description: |
        Only populated while an owner has traffic diagnostics on. Each event
        is one device's view of a connection start, end or drop: overlay
        addresses and ports, protocol (ICMP type and code), resolved source
        and destination identity (device, network resource, approved route
        or unknown), routing peer, the policy rule the coordinator evaluated,
        byte and packet counters and connection type. Never payloads, URLs,
        DNS names or HTTP data. Pass `next_cursor` back as `cursor`.
        Requires `audit:read`.
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, description: "event_at:id cursor" }
        - in: query
          name: from
          schema: { type: integer, description: "Unix seconds; default 24 hours ago" }
        - in: query
          name: to
          schema: { type: integer, description: Unix seconds }
        - in: query
          name: q
          schema: { type: string, maxLength: 100, description: "Names, addresses, rule labels; a number also matches ports" }
        - in: query
          name: source
          schema: { type: string, description: Source device or resource id }
        - in: query
          name: destination
          schema: { type: string, description: Destination device id, resource id or route prefix }
        - in: query
          name: user
          schema: { type: string, description: User who owns the source or destination device }
        - in: query
          name: reporter
          schema: { type: string, format: uuid }
        - in: query
          name: ip
          schema: { type: string }
        - in: query
          name: port
          schema: { type: integer, minimum: 0, maximum: 65535 }
        - in: query
          name: protocol
          schema: { type: string, enum: [tcp, udp, icmp, icmpv6, other] }
        - in: query
          name: direction
          schema: { type: string, enum: [inbound, outbound] }
        - in: query
          name: event_type
          schema: { type: string, enum: [start, end, drop] }
        - in: query
          name: connection_type
          schema: { type: string, enum: [p2p, routed, relay] }
      responses:
        "200": { description: "Envelope of events with next_cursor" }
        "400": { description: Invalid cursor or filter }
        "403": { description: Missing audit:read }
  /api/v1/events/catalogue:
    get:
      summary: List the webhook event types with severity and meaning
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: "Envelope of [{event_type, severity, summary}]" }
        "403": { description: Missing webhooks:read }
  /api/v1/webhooks/{destination_id}/subscriptions:
    put:
      summary: Choose which catalogued event types a destination receives
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: path
          name: destination_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_types]
              additionalProperties: false
              properties:
                event_types:
                  type: array
                  minItems: 1
                  items: { type: string, description: 'A catalogued event type, or "*" for all' }
      responses:
        "200": { description: "Envelope of {destination_id, event_types}" }
        "400": { description: Empty list or unknown event type }
        "403": { description: Missing webhooks:write }
        "404": { description: Destination not in this organisation }
  /api/v1/posture-checks:
    get:
      summary: List posture checks with the policy rules that reference them
      parameters:
        - $ref: "#/components/parameters/Organisation"
      responses:
        "200": { description: Envelope of posture checks }
        "403": { description: Missing devices:read }
    post:
      summary: Create a posture check (same validation as the console)
      parameters:
        - $ref: "#/components/parameters/Organisation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              additionalProperties: false
              properties:
                name: { type: string, description: "1-32 lowercase letters, digits or hyphens" }
                definition: { $ref: "#/components/schemas/PostureDefinition" }
      responses:
        "201": { description: "Envelope of {id, name, version}" }
        "400": { description: Invalid name or definition }
        "403": { description: Missing policy:write }
        "409": { description: Name already exists }
  /api/v1/posture-checks/{check_id}:
    put:
      summary: Replace a posture check definition (optimistic concurrency on version)
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/CheckId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, definition]
              additionalProperties: false
              properties:
                version: { type: integer, description: The version you read }
                definition: { $ref: "#/components/schemas/PostureDefinition" }
      responses:
        "200": { description: "Envelope of {id, name, version}" }
        "403": { description: Missing policy:write }
        "404": { description: Not found }
        "412": { description: Someone else changed it; re-read and retry }
    delete:
      summary: Delete a posture check that no policy rule references
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - $ref: "#/components/parameters/CheckId"
      responses:
        "204": { description: Deleted }
        "403": { description: Missing policy:write }
        "404": { description: Not found }
        "409": { description: Still referenced by policy }
  /api/v1/keys/{key_id}:
    delete:
      summary: Revoke a join key (idempotent)
      parameters:
        - $ref: "#/components/parameters/Organisation"
        - in: path
          name: key_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked or already revoked }
        "403": { description: Missing keys:write }
        "404": { description: Not a join key in this organisation }
  /api/v1/dns/validate:
    post:
      summary: Validate and canonicalise a DNS draft without publishing it
      parameters:
        - $ref: "#/components/parameters/Organisation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dns]
              properties:
                dns: { type: object, description: Same document as PUT /api/v1/dns `dns` }
      responses:
        "200": { description: "Envelope of {dns, warnings}" }
        "400": { description: Invalid DNS document }
        "403": { description: Missing devices:read }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: bta_ automation secret or short-lived bto_ access token. Node tokens and join keys are rejected.
    organisationHeader:
      type: apiKey
      in: header
      name: X-BlakTail-Organisation
  parameters:
    Organisation:
      in: header
      name: X-BlakTail-Organisation
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      in: path
      name: node_id
      required: true
      schema: { type: string, format: uuid }
    PeerId:
      in: path
      name: peer_id
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      in: path
      name: resource_id
      required: true
      schema: { type: string, format: uuid }
    CheckId:
      in: path
      name: check_id
      required: true
      schema: { type: string, format: uuid }
    AuditActor:
      in: query
      name: actor
      schema: { type: string, maxLength: 200, description: "Actor user id, email (case-insensitive) or name" }
    AuditAction:
      in: query
      name: action
      schema: { type: string, maxLength: 200, description: "Exact action, or a prefix ending in . or * (node.*)" }
    AuditTargetType:
      in: query
      name: target_type
      schema: { type: string, maxLength: 200 }
    AuditTargetId:
      in: query
      name: target_id
      schema: { type: string, maxLength: 200 }
    AuditSince:
      in: query
      name: since
      schema: { type: integer, description: "Inclusive Unix seconds" }
    AuditUntil:
      in: query
      name: until
      schema: { type: integer, description: "Exclusive Unix seconds" }
  schemas:
    PostureDefinition:
      type: object
      additionalProperties: false
      description: At least one requirement is needed. Inventory is self-reported by devices, not attested.
      properties:
        description: { type: string, maxLength: 200 }
        min_agent_version: { type: string, example: "0.2.0" }
        os_families: { type: array, items: { type: string, enum: [linux, macos, ios, android, windows] } }
        min_os_versions: { type: object, additionalProperties: { type: string } }
        max_credential_age_secs: { type: integer, minimum: 60, maximum: 31536000 }
        max_report_age_secs: { type: integer, minimum: 60, maximum: 31536000 }
        require_approved_peer: { type: boolean }
        on_missing_data: { type: string, enum: [fail, pass], default: fail }
    NetworkResourceInput:
      type: object
      required: [name, access]
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 256 }
        cidr: { type: string, description: "IPv4 or IPv6 network address, e.g. 10.20.1.0/24 or fd12:3456::/48" }
        dns_target: { type: string, description: "Exact host name; modelled only, resolution is not implemented yet" }
        ports: { type: array, maxItems: 16, items: { type: string }, description: "Recorded, not yet enforced on the routing peer" }
        protocols: { type: array, items: { type: string, enum: [tcp, udp, icmp] } }
        routing_peers:
          type: array
          maxItems: 8
          items:
            type: object
            required: [node_id]
            properties:
              node_id: { type: string, format: uuid }
              metric: { type: integer, minimum: 1, maximum: 9999, default: 100 }
        access:
          type: object
          description: Clients matching any role, tag or policy group receive the prefix.
          properties:
            roles: { type: array, items: { type: string, enum: [owner, admin, member] } }
            tags: { type: array, items: { type: string, enum: [office, ranger, store] } }
            groups: { type: array, items: { type: string } }
        enabled: { type: boolean, default: true }
        allow_nested_overlap: { type: boolean, default: false }
        confirm_public_route: { type: boolean, default: false }
        masquerade: { type: boolean, description: "Only true is accepted; Linux routing peers always masquerade" }
        dry_run: { type: boolean, default: false }
