name: iPhone

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: structure and tagline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate iPhone tree
        run: bash scripts/validate-ios-phone.sh

  rust-dataplane:
    name: boringtun FFI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test iPhone WireGuard crate
        run: cargo test --locked -p blaktail-ios-wg

  swift-test:
    name: swift test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test iPhone client
        working-directory: apps/ios
        run: swift test

      - name: Test shared coordinator client
        working-directory: apps/macos
        run: swift test --filter CoordinatorClientTests
