name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blaktail
          POSTGRES_PASSWORD: blaktail
          POSTGRES_DB: blaktail_coord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blaktail -d blaktail_coord_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BLAKTAIL_COORD_TEST_DATABASE_URL: postgres://blaktail:blaktail@127.0.0.1:5432/blaktail_coord_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Validate operator configuration and service hardening
        run: |
          cargo build --locked -p blaktail-config -p blaktail-coord
          scripts/config-contract-test.sh target/debug/blaktail-config target/debug/blaktail-coord
          target/debug/blaktail-coord check-policy docs/policy/v1-example.json
          target/debug/blaktail-coord check-dns docs/dns/v1-example.json

      - name: Validate rollout scripts
        run: >-
          sh -n scripts/package-agent.sh scripts/install-agent.sh
          scripts/agent-checksums.sh scripts/two-vm-test.sh scripts/config-contract-test.sh
          scripts/conformance/prove-observability.sh scripts/conformance/run-lab.sh
          scripts/conformance/lab-static-test.sh scripts/publish-package-repos.sh
          scripts/admin-api-smoke.sh scripts/admin-openapi-drift.sh
          scripts/control-update-baseline.sh

      - name: Admin OpenAPI drift
        run: scripts/admin-openapi-drift.sh

      - name: Conformance lab self-test
        run: scripts/conformance/lab-static-test.sh

      - name: Validate getting-started path
        run: bash scripts/validate-getting-started.sh

      - name: Build and inspect Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm dpkg-dev
          cargo build --locked -p blaktaild -p blaktail-config
          dist="${RUNNER_TEMP}/blaktail-agent-packages"
          scripts/package-agent.sh deb target/debug/blaktaild "${dist}"
          scripts/package-agent.sh rpm target/debug/blaktaild "${dist}"
          scripts/agent-checksums.sh "${dist}"
          (cd "${dist}" && sha256sum --check SHA256SUMS)
          dpkg-deb --info "${dist}/blaktaild-x86_64-unknown-linux-gnu.deb"
          dpkg-deb --contents "${dist}/blaktaild-x86_64-unknown-linux-gnu.deb" | grep '/usr/local/bin/blaktaild'
          dpkg-deb --contents "${dist}/blaktaild-x86_64-unknown-linux-gnu.deb" | grep '/usr/local/bin/blaktail-config'
          rpm --query --package --info "${dist}/blaktaild-x86_64-unknown-linux-gnu.rpm"
          rpm --query --package --list "${dist}/blaktaild-x86_64-unknown-linux-gnu.rpm" | grep '^/usr/local/bin/blaktaild$'
          rpm --query --package --list "${dist}/blaktaild-x86_64-unknown-linux-gnu.rpm" | grep '^/usr/local/bin/blaktail-config$'
          scripts/publish-package-repos.sh "${dist}" "${RUNNER_TEMP}/blaktail-repos"

      - name: Live coordinator and relay metrics scrape
        run: scripts/conformance/prove-observability.sh

  console:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blaktail
          POSTGRES_PASSWORD: blaktail
          POSTGRES_DB: blaktail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blaktail -d blaktail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://blaktail:blaktail@127.0.0.1:5432/blaktail
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      COORD_BASE_URL: https://coord.example.internal
      BLAKTAIL_AUTH_HMAC_SECRET: ci-auth-hmac-secret-at-least-32-chars
      TEST_DATABASE_URL: postgres://blaktail:blaktail@127.0.0.1:5432/blaktail
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun ci

      - name: Lint
        run: bun --filter @blaktail/console lint

      - name: Typecheck
        run: bun --filter @blaktail/console typecheck

      - name: Migrate with Bun SQL
        run: bun --filter @blaktail/console db:migrate

      - name: Bootstrap race and replay tests
        run: bun --filter @blaktail/console test

      - name: Build
        run: bun --filter @blaktail/console build

      - name: Auth and invitation HTTP E2E
        run: bun --filter @blaktail/console test:auth-e2e

      - name: Roles, step-up and TOTP HTTP E2E
        run: bun --filter @blaktail/console test:roles-e2e

      - name: SCIM Groups, role mapping and deprovision grace E2E
        run: bun --filter @blaktail/console test:scim-e2e
