name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install scanners
        run: |
          tools="$(scripts/ci/install-security-tools.sh)"
          echo "${tools}" >> "${GITHUB_PATH}"

      - name: Scan this revision
        run: scripts/ci/gitleaks-scan.sh

      - name: Dummy secret on a test branch must fail
        run: scripts/ci/prove-gitleaks-detects-dummy.sh

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install scanners
        run: |
          tools="$(scripts/ci/install-security-tools.sh)"
          echo "${tools}" >> "${GITHUB_PATH}"

      - name: cargo deny
        run: scripts/ci/cargo-deny-check.sh
