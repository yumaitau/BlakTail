name: PR Agent

on: # zizmor: ignore[dangerous-triggers] -- Main-only OIDC; API-only review with no PR checkout or execution.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (github.event.comment.body == '/review' ||
         github.event.comment.body == '/describe' ||
         github.event.comment.body == '/improve' ||
         startsWith(github.event.comment.body, '/ask '))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check OIDC configuration and PR eligibility
        id: eligibility
        env:
          OPENCODE_OIDC_CLIENT_ID: ${{ vars.OPENCODE_OIDC_CLIENT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          enabled = bool(os.environ.get("OPENCODE_OIDC_CLIENT_ID"))
          if not enabled:
              print("::notice::PR Agent is inactive. Set the OPENCODE_OIDC_CLIENT_ID Actions variable after configuring OpenCode trust.")
          if enabled and os.environ["GITHUB_EVENT_NAME"] == "issue_comment":
              with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
                  event = json.load(event_file)
              base = os.environ["GITHUB_API_URL"]
              repo = os.environ["GITHUB_REPOSITORY"]
              headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
              request = urllib.request.Request(f"{base}/repos/{repo}/pulls/{event['issue']['number']}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  pr = json.load(response)
              enabled = pr["state"] == "open" and not pr["draft"] and (pr["head"].get("repo") or {}).get("full_name") == repo
              if not enabled:
                  print("::notice::PR Agent only handles open, non-draft, same-repository pull requests.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          PY

      - name: Sign in to OpenCode with GitHub OIDC
        if: steps.eligibility.outputs.enabled == 'true'
        env:
          OPENCODE_OIDC_CLIENT_ID: ${{ vars.OPENCODE_OIDC_CLIENT_ID }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          try:
              audience = urllib.parse.quote("https://opencode.ai/console", safe="")
              request = urllib.request.Request(
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + audience,
                  headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  oidc = json.load(response)["value"]
              print("::add-mask::" + oidc)
              body = urllib.parse.urlencode({
                  "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                  "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
                  "client_id": os.environ["OPENCODE_OIDC_CLIENT_ID"],
                  "subject_token": oidc,
              }).encode()
              request = urllib.request.Request(
                  "https://opencode.ai/console/auth/oauth/token", data=body,
                  headers={"Content-Type": "application/x-www-form-urlencoded", "User-Agent": "Yuma-PR-Agent/1.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)["access_token"]
              if not isinstance(token, str) or not token or any(c in token for c in "\r\n"):
                  raise ValueError("Invalid access token")
              print("::add-mask::" + token)
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write("OPENCODE_API_KEY=" + token + "\n")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"OpenCode OIDC sign-in failed (HTTP {error.code}). Check repository and main-branch trust.") from None
          except (KeyError, ValueError, urllib.error.URLError):
              raise SystemExit("OpenCode OIDC sign-in failed. No usable short-lived token was returned.") from None
          PYCODE

      - name: Verify GLM-5.3 authentication
        if: github.event_name == 'workflow_dispatch' && steps.eligibility.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://opencode.ai/inference/go/openai/v1/chat/completions",
              data=json.dumps({"model": "glm-5.3", "messages": [{"role": "user", "content": "Reply with exactly OK."}], "max_tokens": 128}).encode(),
              headers={"Authorization": "Bearer " + os.environ["OPENCODE_API_KEY"], "Content-Type": "application/json", "User-Agent": "Yuma-PR-Agent/1.0", "x-opencode-session": f"pr-agent-{os.environ['GITHUB_REPOSITORY_ID']}-verify-{os.environ['GITHUB_RUN_ID']}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.load(response)
              if not result.get("choices"):
                  raise ValueError("Missing completion choices")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"GLM-5.3 verification failed (HTTP {error.code}). Check the OpenCode request log and Go allowance.") from None
          except (urllib.error.URLError, ValueError):
              raise SystemExit("GLM-5.3 verification failed. Check OpenCode authentication and Go allowance.") from None
          print("OpenCode Go accepted the short-lived OIDC token for GLM-5.3.")
          PYCODE

      # PR-Agent fetches the diff through GitHub's API; no source checkout needed.
      - name: Review with OpenCode Go
        if: github.event_name != 'workflow_dispatch' && steps.eligibility.outputs.enabled == 'true'
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c # 0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_KEY: ${{ env.OPENCODE_API_KEY }}
          OPENAI.API_BASE: https://opencode.ai/inference/go/openai/v1
          LITELLM.EXTRA_HEADERS: >-
            {"User-Agent":"Yuma-PR-Agent/1.0","x-opencode-session":"pr-agent-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}"}
          CONFIG.MODEL: openai/glm-5.3
          CONFIG.MODEL_WEAK: openai/glm-5.3
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG.RESTRICTED_MODE: 'true'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
