# Supply-chain policy for the Rust workspace.
# Enforced by `cargo deny check` on self-hosted CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Time-limited: sqlx 0.9.0 is the newest release and pins an older
    # libsqlite3-sys, so the fix is not reachable yet. cargo-deny 0.20.2 has
    # no expiry field, so the review date lives in the reason.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys fix needs a newer sqlx than 0.9.0 (latest); remove when sqlx ships it. Review by 2026-12-12." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
